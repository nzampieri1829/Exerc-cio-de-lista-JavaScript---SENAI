<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade 18</title>
</head>
<body>
    <script>
        var numeros = [10,20,30]
        var dobro = []
        alert("A lista é: " + numeros)

        numeros.forEach(function(item){
            dobro.push(item * 2)
        })

        alert("O dobro é: " + dobro)
        
        
    </script>
    
</body>
</html>
